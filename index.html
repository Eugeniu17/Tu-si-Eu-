<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d1a">
  <meta name="description" content="Între noi — o călătorie zilnică pentru Alina și Eugeniu.">
  <title>Între noi ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark">✦</span>
      <div>
        <strong>Între noi</strong>
        <small>Paris · Menton · două inimi</small>
      </div>
    </div>
    <button class="profile-chip" id="profileChip">Alege profilul</button>
  </header>

  <main class="app">
    <section class="route-card">
      <div class="route">
        <div class="city">
          <span class="city__dot city__dot--blue"></span>
          <strong>Paris</strong>
          <small>Eugeniu</small>
        </div>
        <div class="track">
          <span class="track__line"></span>
          <span class="traveler traveler--left" id="leftTraveler"></span>
          <span class="traveler traveler--right" id="rightTraveler"></span>
          <span class="track__heart">❤️</span>
        </div>
        <div class="city city--right">
          <span class="city__dot city__dot--pink"></span>
          <strong>Menton</strong>
          <small>Alina</small>
        </div>
      </div>

      <div class="route-copy">
        <p class="eyebrow" id="routeEyebrow">Drumul nostru</p>
        <h1 id="routeTitle">O zi. Două inimi. Un pas.</h1>
        <p id="routeSubtitle">Fiecare răspunde din locul lui, apoi trimite celuilalt partea sa de drum.</p>
      </div>

      <div class="status-pills" id="statusPills"></div>
    </section>

    <nav class="tabs">
      <button class="tab is-active" data-view="today">Astăzi</button>
      <button class="tab" data-view="path">Drumul</button>
      <button class="tab" data-view="traces">Urmele mele</button>
      <button class="tab" data-view="tomorrow">Pentru mâine</button>
    </nav>

    <section class="view" id="view"></section>
  </main>

  <dialog class="dialog" id="profileDialog">
    <button class="dialog__close" data-close="profileDialog">×</button>
    <div id="profileContent"></div>
  </dialog>

  <dialog class="dialog" id="shareDialog">
    <button class="dialog__close" data-close="shareDialog">×</button>
    <div id="shareContent"></div>
  </dialog>

  <dialog class="dialog" id="letterDialog">
    <button class="dialog__close" data-close="letterDialog">×</button>
    <div id="letterContent"></div>
  </dialog>

  <canvas id="resultCanvas" width="1080" height="1350" hidden></canvas>

  <script src="app.js" type="module"></script>
</body>
</html>
