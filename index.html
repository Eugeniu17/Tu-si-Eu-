<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d1a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Între noi — o călătorie zilnică pentru Alina și Eugeniu.">
  <title>Între noi ❤️</title>
  <link rel="stylesheet" href="./style.css?v=20260803-final3">
  <style>
    /* Stil minim de siguranță: pagina nu mai apare albă chiar dacă browserul păstrează un cache vechi. */
    html,body{min-height:100%;margin:0;background:#070b16;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding-bottom:env(safe-area-inset-bottom)}
    #loadError{display:none;position:fixed;z-index:9999;left:12px;right:12px;bottom:12px;padding:14px 16px;border-radius:16px;background:#4b1627;color:#fff;box-shadow:0 12px 40px #0008;font-size:14px;line-height:1.45}
  </style>
</head>
<body>
  <div id="loadError" role="alert"></div>
  <div class="sky" id="sky" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark">✦</span>
      <div>
        <strong>Între noi</strong>
        <small>Paris · Menton · două inimi</small>
      </div>
    </div>
    <button class="profile-chip" id="profileChip">Alege profilul</button>
  </header>

  <main class="app">
    <section class="route-card">
      <div class="route">
        <div class="city">
          <span class="city__dot city__dot--blue"></span>
          <strong>Paris</strong>
          <small>Eugeniu</small>
        </div>
        <div class="track">
          <span class="track__line"></span>
          <span class="traveler traveler--left" id="leftTraveler"></span>
          <span class="traveler traveler--right" id="rightTraveler"></span>
          <span class="track__heart">❤️</span>
        </div>
        <div class="city city--right">
          <span class="city__dot city__dot--pink"></span>
          <strong>Menton</strong>
          <small>Alina</small>
        </div>
      </div>

      <div class="route-copy">
        <p class="eyebrow" id="routeEyebrow">Drumul nostru</p>
        <h1 id="routeTitle">O zi. Două inimi. Un pas.</h1>
        <p id="routeSubtitle">Fiecare răspunde din locul lui, apoi trimite celuilalt partea sa de drum.</p>
      </div>

      <div class="status-pills" id="statusPills"></div>
    </section>

    <nav class="tabs">
      <button class="tab is-active" data-view="today">Astăzi</button>
      <button class="tab" data-view="path">Drumul</button>
      <button class="tab" data-view="traces">Urmele mele</button>
      <button class="tab" data-view="tomorrow">Pentru mâine</button>
    </nav>

    <section class="view" id="view"></section>
  </main>

  <dialog class="dialog" id="profileDialog">
    <button class="dialog__close" data-close="profileDialog">×</button>
    <div id="profileContent"></div>
  </dialog>

  <dialog class="dialog" id="shareDialog">
    <button class="dialog__close" data-close="shareDialog">×</button>
    <div id="shareContent"></div>
  </dialog>

  <dialog class="dialog" id="letterDialog">
    <button class="dialog__close" data-close="letterDialog">×</button>
    <div id="letterContent"></div>
  </dialog>

  <canvas id="resultCanvas" width="1080" height="1350" hidden></canvas>

  <script>
    window.addEventListener("error", function(event){
      var box=document.getElementById("loadError");
      if(!box)return;
      box.style.display="block";
      box.textContent="Site-ul nu a putut încărca un fișier. Reîncarcă pagina. Detaliu: "+(event.message||"eroare necunoscută");
    });
    window.addEventListener("unhandledrejection", function(event){
      var box=document.getElementById("loadError");
      if(!box)return;
      box.style.display="block";
      box.textContent="Datele zilei nu s-au încărcat. Verifică dacă index.html, style.css, app.js, config.json și days.json sunt în același loc.";
    });
  </script>
  <script src="./app.js?v=20260803-final3" type="module"></script>
</body>
</html>
